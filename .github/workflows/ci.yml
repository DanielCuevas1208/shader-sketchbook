name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          $candidates = @(
            @{ Generator = 'Visual Studio 18 2026'; Directory = 'build-vs18' },
            @{ Generator = 'Visual Studio 17 2022'; Directory = 'build-vs17' },
            @{ Generator = 'Visual Studio 16 2019'; Directory = 'build-vs16' }
          )
          $buildDirectory = $null
          foreach ($candidate in $candidates) {
            cmake -S . -B $candidate.Directory -G $candidate.Generator -A x64
            if ($LASTEXITCODE -eq 0) {
              $buildDirectory = $candidate.Directory
              break
            }
          }
          if ($null -eq $buildDirectory) { exit 1 }
          "BUILD_DIRECTORY=$buildDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        run: cmake --build $env:BUILD_DIRECTORY --config Release --parallel 1
      - name: Test
        run: ctest --test-dir $env:BUILD_DIRECTORY -C Release --output-on-failure
      - name: Upload GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-sketchbook-gpu-capture
          path: |
            ${{ env.BUILD_DIRECTORY }}/gpu_capture.ppm
            tests/fixtures/gpu_composite_reference.ppm
          if-no-files-found: ignore

  ubuntu:
    name: Ubuntu portable tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install portable host headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgl1-mesa-dev libglx-dev libx11-dev
      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux --parallel
      - name: Check the X11 host target
        run: cmake --build build-linux --target shader_sketchbook_x11 --parallel
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
